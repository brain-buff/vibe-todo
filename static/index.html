<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff1f5">
  <title>todos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E☑%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>todos<span class="dot">.</span></h1>
      <div class="head-actions">
        <span id="userEmail" class="muted" hidden></span>
        <button id="logoutBtn" class="btn ghost small" hidden>выйти</button>
        <button id="loginBtn" class="btn ghost small">вход</button>
        <button id="registerBtn" class="btn primary small">регистрация</button>
        <button id="clearDone" class="btn ghost small" hidden>очистить выполненные</button>
        <span id="counter" class="muted"></span>
      </div>
    </header>

    <!-- Модалка входа / регистрации -->
    <div id="authModal" class="modal" hidden>
      <div class="modal-card card">
        <h2 id="authTitle">Вход</h2>
        <form id="authForm" autocomplete="on">
          <label class="field">
            <span class="label">Email</span>
            <input id="aEmail" name="email" type="email" placeholder="you@example.com" required>
          </label>
          <label class="field">
            <span class="label">Пароль</span>
            <input id="aPassword" name="password" type="password" placeholder="••••••" minlength="6" required>
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn primary" id="authSubmit">Войти</button>
            <button type="button" class="btn ghost" id="authCancel">отмена</button>
          </div>
        </form>
      </div>
    </div>

    <form id="todoForm" class="card" autocomplete="off" hidden>
      <input id="fTitle" name="title" type="text" placeholder="Что нужно сделать?" maxlength="200" required>
      <div class="form-row">
        <label class="field">
          <span class="label">Срок</span>
          <input id="fDue" name="due" type="datetime-local">
        </label>
        <label class="field">
          <span class="label">Приоритет</span>
          <select id="fPriority" name="priority">
            <option value="1">низкий</option>
            <option value="2" selected>средний</option>
            <option value="3">высокий</option>
          </select>
        </label>
        <button id="submitBtn" type="submit" class="btn primary">Добавить</button>
        <button id="cancelEdit" type="button" class="btn ghost" hidden>отмена</button>
      </div>
      <textarea id="fDesc" name="description" rows="2" placeholder="Описание (необязательно)" maxlength="2000"></textarea>
    </form>

    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
